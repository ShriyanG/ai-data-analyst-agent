version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-data-analyst-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-data-analyst-app
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:3b
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
